/* ===== Lyzr Emerging Partners — Figma "Lyzr-Brand" 3561:13503 ===== */
:root{
  color-scheme:light;
  --canvas:#FAFAF9; --white:#FFFFFF; --grey100:#F1F0EE; --card:#F1F0EE; --rule:#E3E1DE; --rule2:#E3E1DE;
  --ink:#1F2022; --black:#1F2022; --sub:#6D675E; --stone:#8B857B; --faint:#8B857B; --disabled-bg:#E7E5E2; --disabled-fg:#9A958E;
  --orange:#FF3300; --orange-h:#E82E00; --orange-p:#C72700; --logo-orange:#FF3300;
  --blue:#003F7B; --green:#003C27; --blue2:#003F7B; --cta-sub:rgba(255,255,255,.7); --err:#B3261E;
  --sans:"Aeonik","Figtree","Inter",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,monospace;
  --rail:1320px; --m:60px;
  /* Lyzr brand type scale (size / line-height), Regular weight only */
  --fs-xl:90px; --lh-xl:94px; --fs-hero:64px; --lh-hero:68px; --fs-lg:48px; --lh-lg:52px;
  --fs-sm:36px; --lh-sm:42px; --fs-sub:24px; --lh-sub:30px; --fs-p:18px; --lh-p:24px; --fs-cap:14px; --lh-cap:18px;
  --tr-hero:-0.03em; --tr-lg:-0.025em; --tr-sm:-0.02em;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:100px}
body{margin:0;background:var(--canvas);color:var(--ink);font-family:var(--sans);font-weight:400;-webkit-font-smoothing:antialiased}
h1,h2,h3,p,ol,ul,dl,dd,fieldset{margin:0;padding:0;border:0}
ol,ul{list-style:none}
img{max-width:100%;display:block}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ms{width:1em;overflow:hidden;font-family:"Material Symbols Outlined";font-weight:300;font-style:normal;font-size:24px;line-height:1;letter-spacing:0;text-transform:none;display:inline-block;white-space:nowrap;-webkit-font-feature-settings:"liga";font-feature-settings:"liga";flex:none}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px}

/* type */
.t-xl{font-size:var(--fs-xl);line-height:var(--lh-xl);letter-spacing:var(--tr-hero);font-weight:400}
.t-hero{font-size:var(--fs-hero);line-height:var(--lh-hero);letter-spacing:var(--tr-hero);font-weight:400;color:var(--black)}
.t-display{font-size:var(--fs-lg);line-height:var(--lh-lg);letter-spacing:var(--tr-lg);font-weight:400}
.t-large{font-size:var(--fs-lg);line-height:var(--lh-lg);letter-spacing:var(--tr-lg);font-weight:400;color:var(--ink)}
.t-small{font-size:var(--fs-sub);line-height:var(--lh-sm);letter-spacing:var(--tr-sm);font-weight:400}
.t-sub{font-size:21px;line-height:var(--lh-sub);font-weight:400}
.t-bodyl{font-size:var(--fs-sub);line-height:var(--lh-sub)}
.t-para{font-size:var(--fs-p);line-height:var(--lh-p)}
.t-small-body{font-size:var(--fs-p);line-height:var(--lh-p);color:var(--sub)}
.muted{color:var(--sub)}
.eyebrow{font-family:var(--mono);font-size:var(--fs-cap);line-height:var(--lh-cap);text-transform:uppercase;color:var(--orange)}
.mono-label{font-family:var(--mono);font-weight:400;font-size:var(--fs-cap);line-height:var(--lh-cap);text-transform:uppercase}
.mono-muted{font-family:var(--mono);font-size:var(--fs-cap);line-height:var(--lh-cap);text-transform:uppercase;color:var(--sub)}
.mono-s{font-family:var(--mono);font-size:var(--fs-cap);line-height:var(--lh-cap);text-transform:uppercase;color:var(--sub)}

/* buttons */
.btn{height:40px;padding:0 16px;border-radius:4px;border:1px solid transparent;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:var(--fs-p);line-height:var(--lh-p);white-space:nowrap;transition:background-color .12s,color .12s,border-color .12s}
.btn .ms{font-size:20px}
.btn-ink{background:var(--ink);color:var(--white)}
.btn-ink:hover{background:var(--orange-h)}
.btn-ink:active{background:var(--orange-p)}
.btn[disabled]{background:var(--disabled-bg) !important;color:var(--disabled-fg);opacity:.78;cursor:not-allowed}
.btn-orange{background:var(--orange);color:var(--white)}
.btn-orange:hover{background:var(--orange-h)}
.btn-orange:active{background:var(--orange-p)}
/* Tertiary: ink text, 1px underline, no fill */
.btn-line{height:auto;padding:0;border:0;border-radius:0;background:none;color:var(--ink)}
.btn-line:hover{color:var(--orange)}
.btn-wide{width:100%;height:40px;border:0;border-radius:4px;background:var(--orange);color:var(--white);font-size:var(--fs-p);line-height:var(--lh-p);transition:background-color .12s}
.btn-wide:hover{background:var(--orange-h)}
.btn-wide:active{background:var(--orange-p)}
.link-btn{border:0;background:none;padding:0;font-size:var(--fs-p);line-height:var(--lh-p);text-decoration:underline;text-underline-offset:3px;color:var(--ink)}
.link-btn:hover{color:var(--orange)}

/* inputs */
.input{width:100%;height:48px;padding:0 16px;border:1px solid var(--rule2);border-radius:4px;background:var(--white);font-size:var(--fs-p);line-height:var(--lh-p);color:var(--ink)}
.input::placeholder{color:var(--stone)}
.input:focus{outline:none;border-color:var(--orange)}
.input[aria-invalid="true"]{border-color:var(--err)}
.area{height:auto;padding:12px 12px;resize:vertical}
.input-s{height:40px;font-size:var(--fs-p)}
.err{margin-top:8px;font-size:var(--fs-cap);line-height:var(--lh-cap);color:var(--err)}
.lbl{display:block;font-size:var(--fs-p);line-height:var(--lh-p);color:var(--ink)}
.fld{display:flex;flex-direction:column;gap:8px}
.stack-14{display:flex;flex-direction:column;gap:12px}
.row-12{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.split{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.split-top{align-items:flex-start;flex-wrap:nowrap}

/* nav */
.nav{position:sticky;top:0;z-index:50}
.nav-in{max-width:1440px;margin:0 auto;height:100px;padding:0 var(--m);display:flex;align-items:center;gap:60px}
.nav-brand{display:flex;align-items:center;gap:12px;text-decoration:none;flex:none}
.nav-logo{height:30px;width:auto}
.nav-pill{font-family:var(--mono);font-size:var(--fs-cap);line-height:var(--lh-cap);text-transform:uppercase;padding:4px 8px;border-radius:4px;white-space:nowrap}
.nav-links{flex:1;display:flex;justify-content:space-between;align-items:center}
.nav-link{font-size:var(--fs-p);line-height:var(--lh-p);color:var(--black);text-decoration:none;transition:color .12s}
.nav-link:hover{color:var(--orange)}

/* hero */
.hero{background:var(--canvas)}
.rail{max-width:calc(var(--rail) + var(--m)*2);margin:0 auto;padding:0 var(--m)}
.hero-in{padding-top:80px;padding-bottom:0;display:flex;flex-direction:column;gap:100px}
.hero-copy{display:flex;flex-direction:column;gap:24px}
.hero-row{display:flex;justify-content:space-between;align-items:flex-end;gap:48px}
.hero-sub{max-width:470px;color:var(--black)}
.hero-form{max-width:560px}
.field-row{display:flex;gap:8px;margin-top:30px}
.field-row .input{height:40px}
.hero-media{height:648px;border-radius:4px;overflow:hidden;background:var(--white)}
.hero-media img{width:100%;height:100%;object-fit:cover}

/* logo cloud */
.logos{background:var(--canvas);padding:128px 0}
.logos-h{text-align:center;color:var(--ink);padding:0 24px}
.logos-track{margin-top:48px;display:flex;align-items:center;overflow:hidden;mask-image:linear-gradient(90deg,transparent 0,#000 120px,#000 calc(100% - 120px),transparent 100%);background:var(--canvas)}
.lg{flex:none;height:96px;padding:0 30px;display:flex;align-items:center;justify-content:center;gap:12px;color:var(--ink);text-decoration:none}
.lg-i,.lg-a,.lg-b{transition:filter .2s ease,opacity .2s ease}
.lg:hover .lg-i{filter:none}
.lg-a{height:44px;width:auto;filter:brightness(0)}
.lg-b{height:72px;width:auto;filter:brightness(0)}
.lg-i{width:72px;height:72px;object-fit:contain;border-radius:4px;filter:grayscale(1) contrast(1.2);mix-blend-mode:multiply;flex:none}
.lg-n{font-size:var(--fs-cap);line-height:var(--lh-cap);white-space:nowrap;color:var(--sub)}

/* sections */
.sec{max-width:1440px;margin:0 auto}
.changing{background:var(--canvas);padding:60px var(--m) 128px var(--m);display:flex;flex-direction:column;gap:48px;max-width:none}
.head{display:flex;flex-direction:column;gap:12px;max-width:var(--rail);width:100%;margin:0 auto}
.head-h{max-width:600px;color:var(--ink)}
.press-wrap{max-width:var(--rail);width:100%;margin:0 auto}
.press-grid{display:grid;grid-template-columns:1fr 1.7fr 1fr;gap:24px;align-items:stretch}
.card-h{font-size:var(--fs-sub);line-height:var(--lh-sub);letter-spacing:-0.01em;font-weight:400;color:var(--ink)}
.side-card{background:var(--white);border:1px solid var(--rule);border-radius:4px;padding:30px 24px;min-height:220px;display:flex;flex-direction:column;justify-content:space-between;gap:30px}
.pills{display:flex;flex-direction:column;gap:8px}
.pill{height:40px;padding:0 12px;display:flex;align-items:center;gap:12px;background:var(--white);border:1px solid var(--rule);border-radius:4px;font-size:var(--fs-p);line-height:var(--lh-p);color:var(--black);white-space:nowrap}
.dot{width:6px;height:6px;border-radius:50%;background:var(--orange);flex:none}
.press{background:var(--blue);color:var(--white);border-radius:4px;padding:30px;display:flex;flex-direction:column;gap:24px;min-width:0}
.press-label{font-family:var(--mono);font-size:var(--fs-cap);line-height:var(--lh-cap);text-transform:uppercase}
.press-title{font-size:32px;line-height:var(--lh-sm);letter-spacing:var(--tr-sm);color:var(--white);max-width:520px}
.press-track{flex:1;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;border-radius:4px;min-height:0}
.press-track::-webkit-scrollbar{display:none}
.pc{flex:none;width:100%;scroll-snap-align:start;background:var(--white);color:var(--ink);border-radius:4px;padding:24px;display:flex;flex-direction:column;gap:24px}
.pc-vis{min-height:136px;display:flex;flex-direction:column;justify-content:center}
.pc-k{font-family:var(--mono);font-size:var(--fs-cap);line-height:var(--lh-cap);text-transform:uppercase;color:var(--sub);margin-bottom:8px}
.pc-row{display:flex;justify-content:space-between;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--rule);font-size:var(--fs-p);line-height:var(--lh-p)}
.pc-last{border-bottom:0}
.pc-tag{font-family:var(--mono);font-size:var(--fs-cap);line-height:var(--lh-cap);text-transform:uppercase;color:var(--orange)}
.pc-bars{display:flex;flex-direction:column;gap:12px}
.pc-bar{display:flex;flex-direction:column;gap:8px}
.pc-bl{display:flex;justify-content:space-between;font-size:var(--fs-p);line-height:var(--lh-p);color:var(--sub)}
.pc-fill{height:14px;border-radius:2px;background:var(--ink)}
.pc-short{width:14%;background:var(--orange)}
.pc-qs{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.pc-q{padding:8px 12px;border-radius:4px;font-size:var(--fs-p);line-height:var(--lh-p);background:var(--canvas);border:1px solid var(--rule)}
.pc-qd{background:var(--ink);color:var(--white);border-color:var(--ink)}
.pc-foot{display:flex;gap:12px;align-items:baseline;padding-top:12px;border-top:1px solid var(--rule)}
.pc-n{font-family:var(--mono);font-size:var(--fs-cap);line-height:var(--lh-cap);color:var(--orange)}
.pc-t{font-size:var(--fs-p);line-height:var(--lh-p)}
.press-ctl{display:flex;justify-content:space-between;align-items:center}
.bars{display:flex;gap:4px;align-items:center}
.bar-btn{border:0;background:none;padding:12px 0;display:flex}
.bar{display:block;width:32px;height:6px}
.circ-pair{display:flex;gap:8px}
.circ{width:40px;height:40px;border-radius:50%;border:1px solid var(--ink);background:transparent;color:var(--ink);display:flex;align-items:center;justify-content:center;padding:0;transition:background-color .12s,color .12s}
.circ:hover{background:var(--ink);color:var(--white)}
.circ .ms{font-size:20px}
.circ[data-ui-off]{opacity:.3;pointer-events:none}
.circ-w{border-color:var(--white);color:var(--white)}
.circ-w:hover{background:var(--white);color:var(--blue)}

/* wedge */
.wedge{background:#fff;padding:128px var(--m)}
.wedge-panel{max-width:var(--rail);margin:0 auto;background:var(--green);color:#fff;border-radius:4px;padding:60px;display:flex;gap:90px;align-items:center}
.wedge-intro{flex:none;width:424px;display:flex;flex-direction:column;gap:24px}
.wedge-list{flex:1;min-width:0;display:flex;flex-direction:column;gap:48px}
.acc{padding:12px 0 0}
.acc-i{display:flex;gap:12px;align-items:center;padding:24px 0;border-bottom:1px solid var(--rule)}
.wedge-panel .eyebrow,.wedge-panel .t-large,.wedge-panel .t-desc,.wedge-panel .t-sub,.wedge-panel .mono-muted,.wedge-panel .acc-n,.wedge-panel .card-action{color:#fff}
.wedge-panel .acc-i{border-bottom-color:rgba(255,255,255,.3)}
.wedge-panel .card-action:hover{color:#fff;opacity:.7}
.acc-n{font-family:var(--mono);font-size:var(--fs-cap);line-height:var(--lh-cap);color:var(--logo-orange);flex:none}
.card-action{align-self:flex-start;border:0;background:none;padding:0;display:inline-flex;align-items:center;gap:8px;font-family:var(--sans);font-size:var(--fs-p);line-height:var(--lh-p);color:var(--ink);transition:color .12s}
.card-action:hover{color:var(--orange)}

/* agent */
.agent{position:relative;overflow:hidden;padding:128px var(--m);color:var(--white)}
.agent-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.agent-shade{position:absolute;inset:0;background:rgba(0,63,123,.4)}
.agent-cols{position:relative;max-width:var(--rail);margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:60px}
.agent-left{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:24px}
.t-desc{font-size:var(--fs-p);line-height:var(--lh-p);font-weight:400}
.agent-left .t-display,.agent-left .t-desc{max-width:520px;color:var(--white)}
.form-card{flex:1 1 0;min-width:0;background:var(--white);color:var(--black);border-radius:4px;padding:0;overflow:hidden;display:flex;flex-direction:column;gap:0}
.fc-top{display:flex;flex-direction:column;gap:24px;padding:30px 48px;background:#fff;border-bottom:1px solid var(--rule)}
.fc-body{padding:48px;background:var(--white)}
.fc-name{color:var(--orange)}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:21px;font-family:var(--sans)}
.crumb{display:flex;align-items:center;gap:24px}
.crumb+.crumb::before{content:"chevron_right";font-family:"Material Symbols Outlined";font-size:var(--fs-p);line-height:1;color:var(--faint);-webkit-font-feature-settings:"liga";font-feature-settings:"liga"}
.crumb-t{font-family:var(--mono);font-weight:400;font-size:var(--fs-cap);line-height:var(--lh-cap);text-transform:uppercase}
.step{display:flex;flex-direction:column;gap:30px}
.loads{display:flex;flex-direction:column}
.load{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--rule);font-size:var(--fs-p);line-height:var(--lh-p)}
.note{display:flex;flex-direction:column;gap:12px;background:var(--grey100);border-radius:4px;padding:24px}
.fs{display:flex;flex-direction:column;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:40px;padding:0 12px;border-radius:4px;font-size:var(--fs-p);line-height:var(--lh-p)}
.paths{display:flex;flex-direction:column;gap:12px}
.path{text-align:left;border-radius:4px;padding:24px 24px;display:grid;grid-template-columns:auto 1fr;column-gap:12px;row-gap:8px;align-items:baseline;transition:border-color .12s}
.path-t{font-size:var(--fs-sub);line-height:var(--lh-sub);color:var(--ink)}
.path-w{grid-column:2;font-size:var(--fs-p);line-height:var(--lh-p);color:var(--sub)}
.count{flex:none;padding-top:8px}
.accts{display:flex;flex-direction:column;gap:8px}
.acct{display:grid;grid-template-columns:28px 1.2fr 1fr 1.2fr;gap:8px;align-items:center}
.sel{appearance:auto}
.consent{display:flex;gap:12px;align-items:flex-start;font-size:var(--fs-p);line-height:var(--lh-p);color:var(--ink)}
.check{width:18px;height:18px;margin:4px 0 0;accent-color:var(--orange);flex:none}
.pkg{border:1px solid var(--rule);border-radius:4px;padding:24px;display:flex;flex-direction:column;gap:12px;background:var(--white)}
.pkg-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.pkg-i{display:flex;flex-direction:column;gap:8px}
.elig{border-radius:4px;padding:24px 24px;display:flex;flex-direction:column;gap:8px}
.sum{display:grid;grid-template-columns:140px 1fr;row-gap:12px;column-gap:12px;align-items:baseline;border-top:1px solid var(--rule);padding-top:24px}
.sum dd{font-size:var(--fs-p);line-height:var(--lh-p);word-break:break-word}

/* outcome */
.outcome{background:var(--canvas);padding:128px var(--m);display:flex;flex-direction:column;gap:108px}
.story-row{max-width:var(--rail);width:100%;margin:0 auto;display:flex;gap:30px;align-items:center}
.story-l{flex:1;min-width:0;display:flex;flex-direction:column;gap:24px}
.story-p{flex:none;width:496px}
.offer{max-width:var(--rail);width:100%;margin:0 auto;display:flex;flex-direction:column;gap:24px}
.offer-h{display:flex;justify-content:space-between;gap:24px;font-family:var(--mono);font-size:var(--fs-cap);line-height:var(--lh-cap);text-transform:uppercase;color:var(--black)}
.offer-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:30px}
.ccard{min-height:328px;background:var(--white);border:1px solid var(--rule);border-radius:4px;padding:24px;display:flex;flex-direction:column;justify-content:space-between;gap:48px}
.ic-tile{width:40px;height:40px;border-radius:4px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.ic-tile .ms{font-size:22px}
.ccard-copy{display:flex;flex-direction:column;gap:24px}

/* how it works */
.how{background:#fff;padding:128px var(--m);display:flex;flex-direction:column;gap:48px}
.how>*{max-width:var(--rail);width:100%;margin-left:auto;margin-right:auto}
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,315px));justify-content:space-between;padding:24px 0;gap:24px}
.stp{display:flex;flex-direction:column;gap:24px;border-top:2px solid var(--orange);padding-top:24px}
.stp-n{font-family:var(--mono);font-size:var(--fs-cap);line-height:var(--lh-cap);text-transform:uppercase;color:var(--sub)}
.stp .t-sub{color:var(--ink)}

/* stories */
.stories{background:var(--canvas);padding:128px 0;overflow:hidden}
.stories-head{max-width:var(--rail);margin:0 auto 48px;padding:0 var(--m);box-sizing:content-box;display:flex;justify-content:space-between;align-items:center;gap:48px}
.stories-h{max-width:555px}
.stories-p{max-width:560px;color:var(--black)}
.st-track{display:flex;gap:24px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding:0 max(var(--m),calc((100% - var(--rail))/2));scroll-padding:0 max(var(--m),calc((100% - var(--rail))/2))}
.st-track::-webkit-scrollbar{display:none}
.st{position:relative;flex:none;width:897px;height:499px;border-radius:4px;overflow:hidden;scroll-snap-align:start;background:var(--ink);color:var(--white)}
.st-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.st::after{content:"";position:absolute;inset:0;background:rgba(20,21,23,.66)}
.st-in{position:relative;z-index:1;padding:48px 60px;max-width:689px;height:100%;display:flex;flex-direction:column;gap:48px}
.st-logo{height:40px;width:auto;filter:brightness(0) invert(1);align-self:flex-start}
.st-logo-b{height:64px}
.st-word{font-size:var(--fs-sm);line-height:var(--lh-sm);letter-spacing:var(--tr-sm)}
.st-copy{display:flex;flex-direction:column;gap:24px}
.st-copy .t-para{color:var(--white);max-width:460px}
.st-t{font-size:var(--fs-sm);line-height:var(--lh-sm);letter-spacing:var(--tr-sm);font-weight:400;color:var(--white)}
.st-link{display:inline-flex;align-items:center;gap:8px;font-size:var(--fs-p);line-height:var(--lh-p);text-decoration:none;align-self:flex-start;transition:opacity .12s}
.st-link:hover{opacity:.7}
.card-action .ms,.st-link .ms,.btn-line .ms{font-size:20px;color:var(--orange);transition:transform .2s cubic-bezier(.2,.7,.2,1)}
.card-action:hover .ms,.st-link:hover .ms,.btn-line:hover .ms{transform:translate(2px,-2px)}
.st-soon .mono-label{color:var(--orange)}
.stories-side{display:flex;flex-direction:column;align-items:flex-end;gap:24px;max-width:560px}
.stories-side .stories-p{text-align:left}
.st-ctl{display:flex;gap:8px}

/* team */
.team{background:#fff;padding:128px var(--m);display:flex;flex-direction:column;gap:48px}
.team>*{max-width:var(--rail);width:100%;margin-left:auto;margin-right:auto}
.team-grid{display:grid;grid-template-columns:minmax(0,1fr) 479px;gap:90px;align-items:start}
.perks{display:flex;flex-direction:column}
.perk{display:grid;grid-template-columns:160px 1fr;gap:24px;padding:24px 0;border-bottom:1px solid var(--rule)}
.perk:first-child{border-top:1px solid var(--rule)}
.perk-k{font-size:var(--fs-sub);line-height:var(--lh-sub);letter-spacing:0;padding-top:4px;color:var(--orange)}
.perk-word{font-size:var(--fs-sub);line-height:var(--lh-sub);letter-spacing:0;padding-top:8px}
.perk-c{display:flex;flex-direction:column;gap:8px}
.perks-cta{display:flex;align-items:center;gap:24px;margin-top:48px;flex-wrap:wrap}
.person{display:flex;flex-direction:column;gap:24px}
.person-media{position:relative;height:560px;border-radius:4px;overflow:hidden;background:var(--grey100)}
.ph{position:absolute;inset:0;transition:opacity .6s cubic-bezier(.2,.7,.2,1)}
.ph img{width:100%;height:100%;object-fit:cover;position:relative}
.ph-i{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:var(--fs-cap);line-height:var(--lh-cap);color:var(--sub)}
.ph-count{position:absolute;left:16px;bottom:16px;font-family:var(--mono);font-size:var(--fs-cap);line-height:var(--lh-cap);background:var(--white);color:var(--ink);padding:8px 12px;border-radius:4px}
.person-meta{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.person-id{display:flex;flex-direction:column;gap:8px}
.li{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-size:var(--fs-cap);line-height:var(--lh-cap);text-transform:uppercase;text-decoration:none;border:1px solid var(--ink);border-radius:4px;height:32px;padding:0 12px;transition:background-color .12s,color .12s}
.li .ms{font-size:16px}
.li:hover{background:var(--ink);color:var(--white)}
.person-ctl{display:flex;justify-content:space-between;align-items:center}

/* final cta */
.final{background:var(--blue2);min-height:382px;padding:128px max(var(--m),calc((100% - var(--rail))/2));display:flex;justify-content:space-between;align-items:center;gap:48px;color:var(--white)}
.final-copy{display:flex;flex-direction:column;gap:30px;max-width:640px}
.final-copy .t-large{color:var(--white);max-width:520px}
.final-k{color:var(--orange);margin-bottom:-8px}
.final-p{font-family:var(--sans);font-size:var(--fs-p);line-height:var(--lh-p);color:var(--cta-sub);max-width:520px}
.final-btns{display:flex;gap:24px;align-items:center;flex-wrap:wrap}
.btn-l{height:40px;padding:0 16px;border:0;border-radius:4px;display:inline-flex;align-items:center;gap:12px;font-family:var(--sans);font-size:var(--fs-p);line-height:var(--lh-p);white-space:nowrap;transition:background-color .12s,color .12s}
.btn-l .ms{font-size:20px}
.btn-l-o{background:var(--orange);color:var(--white)}
.btn-l-o:hover{background:var(--orange-h)}
.btn-l-w{background:var(--white);color:var(--black);min-width:236px}
.btn-l-w:hover{background:var(--grey100)}

/* footer */
.foot{background:var(--canvas);border-top:1px solid var(--rule);padding:60px var(--m) 30px}
.foot-in,.foot-legal{max-width:var(--rail);margin:0 auto}
.foot-in{display:flex;justify-content:space-between;gap:48px;flex-wrap:wrap}
.foot-logo{height:28px;width:auto}
.foot-cols{display:flex;gap:90px}
.foot-col{display:flex;flex-direction:column;gap:12px}
.foot-col a{font-size:var(--fs-p);line-height:var(--lh-p);text-decoration:none}
.foot-col a:hover{color:var(--orange)}
.foot-legal{margin-top:60px;padding-top:24px;border-top:1px solid var(--rule)}

/* tablet */
@media (max-width:1380px){
  .press-grid{grid-template-columns:1fr 1.5fr 1fr}
  .press-wrap{display:block}
}
@media (max-width:1100px){
  :root{--m:36px}
  .nav-in{gap:30px}
  .nav-links{gap:24px;justify-content:flex-end}
  .hero-row{flex-direction:column;align-items:flex-start;gap:24px}
  .hero-media{height:480px}
  .press-grid{grid-template-columns:1fr 1fr}
  .press{grid-column:1/-1;grid-row:1}
  .side-card{min-height:0}
  .wedge-panel{flex-direction:column;align-items:stretch;gap:48px}
  .wedge-intro{width:auto}
  .agent-cols{flex-direction:column;align-items:stretch}
  .story-row{flex-direction:column;align-items:flex-start}
  .story-p{width:auto;max-width:620px}
  .offer-grid{grid-template-columns:1fr}
  .ccard{min-height:220px}
  .steps{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stories-head{flex-direction:column;align-items:flex-start}
  .st{width:min(720px,calc(100vw - 72px))}
  .team-grid{grid-template-columns:1fr}
  .person{max-width:479px}
  .final{flex-direction:column;align-items:flex-start}
}
@media (max-width:760px){
  :root{--m:20px}
  .nav-in{height:72px}
  .nav-links,.nav-pill{display:none}
  .nav .btn{margin-left:auto}
  /* one step down the brand scale */
  .t-hero{font-size:var(--fs-lg);line-height:var(--lh-lg);letter-spacing:var(--tr-lg)}
  .t-display,.t-large{font-size:var(--fs-sm);line-height:var(--lh-sm);letter-spacing:var(--tr-sm)}
  .t-small{font-size:var(--fs-sub);line-height:var(--lh-sub);letter-spacing:0}
  .t-bodyl,.final-p{font-size:var(--fs-p);line-height:var(--lh-p)}
  .field-row{flex-direction:column}
  .hero-media{height:300px}
  .logos-track{margin-top:48px}
  .changing{padding:60px var(--m) 0}
  .press-grid{grid-template-columns:1fr}
  .press{grid-column:auto;grid-row:auto;padding:24px 24px}
  .pill{font-size:var(--fs-p);line-height:var(--lh-p)}
  .wedge-panel{padding:30px 24px}
  .agent{padding:60px var(--m)}
  .form-card{padding:0;gap:0}
  .fc-top{padding:24px}
  .fc-body{padding:24px}
  .acct{grid-template-columns:24px 1fr}
  .acct>.input{grid-column:2}
  .pkg-grid{grid-template-columns:1fr}
  .sum{grid-template-columns:1fr;row-gap:4px}
  .sum dd{margin-bottom:12px}
  .split-top{flex-wrap:wrap}
  .outcome{padding:60px var(--m) 0;gap:48px}
  .how{padding:60px var(--m) 0}
  .wedge{padding:60px var(--m)}
  .offer-h{flex-direction:column;gap:8px}
  .steps{grid-template-columns:1fr}
  .stories{padding:60px 0 0}
  .stories-head{margin-bottom:48px}
  .st{width:calc(100vw - 40px);height:auto;min-height:460px}
  .st-in{padding:30px 24px;gap:30px}
  .st-t{font-size:var(--fs-sub);line-height:var(--lh-sub);letter-spacing:0}
  .team{padding:60px var(--m)}
  .perk{grid-template-columns:1fr;gap:8px}
  .person-media{height:420px}
  .final{padding:60px var(--m)}
  .foot-cols{gap:48px}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{transition:none !important;animation:none !important}
}
.hero-row .t-hero{flex:1 1 auto;min-width:0}
.hero-row .hero-sub{flex:0 0 430px}
@media (max-width:1100px){.hero-row .hero-sub{flex:none}}

/* ===== Lyzr motion: calm, reveal-only, off under reduced motion ===== */
@keyframes lyzr-rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes lyzr-fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:no-preference){
  .hero-copy>*{animation:lyzr-rise .7s cubic-bezier(.2,.7,.2,1) both}
  .hero-copy>:nth-child(2){animation-delay:120ms}
  .hero-copy>:nth-child(3){animation-delay:240ms}
  .hero-media{animation:lyzr-fade .9s ease both;animation-delay:360ms}
  html.js [data-reveal]{opacity:0;transform:translateY(24px);transition:opacity .7s cubic-bezier(.2,.7,.2,1),transform .7s cubic-bezier(.2,.7,.2,1);transition-delay:var(--d,0ms)}
  html.js [data-reveal][data-in]{opacity:1;transform:none}
}
#lyzr-progress{position:fixed;left:0;top:0;height:2px;width:100%;background:var(--orange);transform-origin:0 50%;transform:scaleX(0);z-index:60;pointer-events:none}
@media (max-width:960px){
  .nav-links{display:none}
  .nav .btn{margin-left:auto}

<section class="agent" id="agent" ref="{{ agentRef }}" data-screen-label="05 Opportunity agent" aria-labelledby="agent-h">
  <img loading="lazy" decoding="async" class="agent-bg" src="/assets/290e1efb116c5862.png" alt="" aria-hidden="true">
  <div class="agent-shade" aria-hidden="true"></div>
  <div class="agent-cols" data-reveal="">
    <div class="agent-left">
      <span class="mono-label">Your next move</span>
      <h2 class="t-display" id="agent-h">Where’s your next million-dollar AI deal?</h2>
      <p class="t-desc">Tell us about your firm. We’ll show you the AI services you could sell, and how Lyzr helps you deliver them.</p>
    </div>
    <div class="form-card">
      <div class="fc-top">
        <span class="mono-label fc-name">Partner Opportunity Agent</span>
        <ol class="crumbs" aria-label="Progress">
          <sc-for list="{{ stages }}" as="st">
            <li class="crumb" aria-current="{{ st.current }}"><span class="crumb-t" style="color:{{ st.color }}">{{ st.label }}</span></li>
          </sc-for>
        </ol>
      </div>
      <div class="fc-body" aria-live="polite">
        <sc-if value="{{ s0 }}">
          <form class="step" sc-camel-on-submit="{{ analyse }}" sc-camel-no-validate="{{ true }}">
            <div class="t-sub">Give us your work email and we'll show you the AI services you could take to the clients you already have.</div>
            <div class="stack-14">
              <div class="fld">
                <label class="lbl" for="site">What's your work email?</label>
                <input class="input" id="site" ref="{{ urlRef }}" type="email" sc-camel-input-mode="email" sc-camel-auto-complete="email" placeholder="you@yourcompany.com" value="{{ url }}" sc-camel-on-change="{{ onUrl }}" aria-invalid="{{ urlInvalid }}" aria-describedby="site-help">
              </div>
              <button class="btn-wide" type="submit">See my opportunity</button>
            </div>
            <sc-if value="{{ urlError }}">
              <p class="err" id="site-help" role="alert">{{ urlError }}</p>
            </sc-if>
          </form>
        </sc-if>

        <sc-if value="{{ s1 }}">
          <div class="step">
            <p class="t-sub">Exploring {{ domain }}</p>
            <ul class="loads">
              <sc-for list="{{ loadSteps }}" as="ls">
                <li class="load" style="color:{{ ls.color }}"><span>{{ ls.label }}</span><span class="mono-s">{{ ls.status }}</span></li>
              </sc-for>
            </ul>
            <sc-if value="{{ failed }}">
              <div class="note" role="alert">
                <p class="t-para">We couldn't reach the analysis service just now. Nothing you entered has been lost.</p>
                <div class="row-12">
                  <button class="btn btn-ink" type="button" sc-camel-on-click="{{ retry }}">Retry</button>
                  <button class="btn btn-line" type="button" sc-camel-on-click="{{ back }}">Change website</button>
                </div>
              </div>
            </sc-if>
          </div>
        </sc-if>

        <sc-if value="{{ s2 }}">
          <div class="step">
            <div class="split">
              <p class="t-sub">Here's my draft of your business.</p>
              <span class="mono-s">Draft · edit anything</span>
            </div>
            <div class="fld">
              <label class="lbl" for="profile">Company summary</label>
              <textarea class="input area" id="profile" rows="4" value="{{ profile }}" sc-camel-on-change="{{ onProfile }}"></textarea>
            </div>
            <fieldset class="fs">
              <legend class="lbl">Which best describes your firm?</legend>
              <div class="chips">
                <sc-for list="{{ categories }}" as="c">
                  <button class="chip" type="button" aria-pressed="{{ c.on }}" sc-camel-on-click="{{ c.pick }}" style="border:1px solid {{ c.border }};background:{{ c.bg }};color:{{ c.fg }}">{{ c.label }}</button>
                </sc-for>
              </div>
            </fieldset>
            <div class="split">
              <button class="btn btn-line" type="button" sc-camel-on-click="{{ back }}">Back</button>
              <button class="btn btn-ink" type="button" sc-camel-on-click="{{ next }}">Looks right · see paths <span class="ms" aria-hidden="true">arrow_forward</span></button>
            </div>
          </div>
        </sc-if>

        <sc-if value="{{ s3 }}">
          <div class="step">
            <p class="t-sub">Three service lines that fit a {{ categoryLabel }} firm. Pick one to explore.</p>
            <div class="paths" role="radiogroup" aria-label="Recommended service lines">
              <sc-for list="{{ paths }}" as="p">
                <button class="path" type="button" role="radio" aria-checked="{{ p.on }}" sc-camel-on-click="{{ p.pick }}" style="border:1px solid {{ p.border }};background:{{ p.bg }}">
                  <span class="acc-n">{{ p.n }}</span>
                  <span class="path-t">{{ p.t }}</span>
                  <span class="path-w">{{ p.why }}</span>
                </button>
              </sc-for>
            </div>
            <div class="split">
              <button class="btn btn-line" type="button" sc-camel-on-click="{{ back }}">Back</button>
              <button class="btn btn-ink" type="button" sc-camel-on-click="{{ next }}" disabled="{{ noChoice }}" style="background:{{ nextBg }}">Continue <span class="ms" aria-hidden="true">arrow_forward</span></button>
            </div>
          </div>
        </sc-if>

        <sc-if value="{{ s4 }}">
          <div class="step">
            <div class="split split-top">
              <p class="t-sub">Before we connect you with our partner team, which five customers do you already have strong relationships with?</p>
              <span class="mono-s count">{{ filled }}/5</span>
            </div>
            <p class="t-small-body">Share five accounts to unlock your activation package. Names and roles only, nothing confidential. Account details are seen only by Lyzr's partner team and are never shared with other partners.</p>
            <div class="accts">
              <sc-for list="{{ accounts }}" as="a">
                <div class="acct">
                  <span class="acc-n">{{ a.n }}</span>
                  <input class="input input-s" aria-label="{{ a.nameLabel }}" placeholder="Account name" value="{{ a.name }}" sc-camel-on-change="{{ a.onName }}">
                  <sc-raw-select class="input input-s sel" aria-label="{{ a.depthLabel }}" value="{{ a.depth }}" sc-camel-on-change="{{ a.onDepth }}">
                    <option value="">Relationship</option>
                    <option value="Strategic">Strategic</option>
                    <option value="Established">Established</option>
                    <option value="New">New</option>
                  </sc-raw-select>
                  <input class="input input-s" aria-label="{{ a.roleLabel }}" placeholder="Contact role (optional)" value="{{ a.role }}" sc-camel-on-change="{{ a.onRole }}">
                </div>
              </sc-for>
            </div>
            <label class="consent">
              <input class="check" type="checkbox" checked="{{ consent }}" sc-camel-on-change="{{ onConsent }}">
              I agree that Lyzr can store these account names to plan joint opportunities with me.
            </label>
            <div class="split">
              <button class="btn btn-line" type="button" sc-camel-on-click="{{ back }}">Back</button>
              <div class="row-12">
                <button class="link-btn" type="button" sc-camel-on-click="{{ skip }}">I'll share these later</button>
                <button class="btn btn-ink" type="button" sc-camel-on-click="{{ next }}" disabled="{{ accountsBlocked }}" style="background:{{ accountsBg }}">Continue <span class="ms" aria-hidden="true">arrow_forward</span></button>
              </div>
            </div>
          </div>
        </sc-if>

        <sc-if value="{{ s5 }}">
          <div class="step">
            <p class="t-sub">Support for your first opportunity.</p>
            <sc-if value="{{ showOffer }}">
              <div class="pkg">
                <div class="split">
                  <span class="mono-s">What you get</span>
                  <span class="mono-s">Activation package</span>
                </div>
                <div class="pkg-grid">
                  <div class="pkg-i"><span class="mono-s">Platform</span><span class="t-para">Studio and Architect credits</span></div>
                  <div class="pkg-i"><span class="mono-s">Marketing</span><span class="t-para">Joint go-to-market</span></div>
                  <div class="pkg-i"><span class="mono-s">Sales</span><span class="t-para">Dedicated SDR support</span></div>
                </div>
              </div>
            </sc-if>
            <div class="elig" style="background:{{ eligBg }}">
              <span class="mono-s" style="color:{{ eligFg }}">{{ eligTitle }}</span>
              <span class="t-para">{{ eligText }}</span>
            </div>
            <div class="split">
              <button class="btn btn-line" type="button" sc-camel-on-click="{{ back }}">Back</button>
              <button class="btn btn-ink" type="button" sc-camel-on-click="{{ next }}">Continue <span class="ms" aria-hidden="true">arrow_forward</span></button>
            </div>
          </div>
        </sc-if>

        <sc-if value="{{ s6 }}">
          <div class="step">
            <h3 class="t-sub">You already have a starting point. Let's build on it.</h3>
            <p class="t-para muted">We've identified opportunities based on your business. Our partner team can help you choose the first one worth pursuing.</p>
            <dl class="sum">
              <dt class="mono-s">Company</dt><dd>{{ domain }}</dd>
              <dt class="mono-s">Work email</dt><dd>{{ workEmailLabel }}</dd>
              <dt class="mono-s">Firm type</dt><dd>{{ categoryLabel }}</dd>
              <dt class="mono-s">First path</dt><dd>{{ choiceLabel }}</dd>
              <dt class="mono-s">Accounts</dt><dd>{{ filled }} of 5 shared</dd>
            </dl>
            <sc-if value="{{ notSubmitted }}">
              <div class="split">
                <button class="btn btn-line" type="button" sc-camel-on-click="{{ back }}">Back</button>
                <button class="btn btn-orange" type="button" sc-camel-on-click="{{ submit }}">Request a conversation <span class="ms" aria-hidden="true">arrow_forward</span></button>
              </div>
            </sc-if>
            <sc-if value="{{ submitted }}">
              <div class="note" role="status">
                <span class="t-para">Request recorded in this prototype. Nothing has been sent. In production, your partner manager would receive this summary and reach out.</span>
                <button class="link-btn" type="button" sc-camel-on-click="{{ restart }}">Start a new assessment</button>
              </div>
            </sc-if>
          </div>
        </sc-if>
      </div>
    </div>
  </div>
</section>

  <div class="story-row" data-reveal="">
    <div class="story-l">
      <span class="eyebrow">Built to help you deliver</span>
      <h2 class="t-large">You bring the relationships.<br>We bring the team.</h2>

        <button class="btn btn-orange" type="button" sc-camel-on-click="{{ goAgent }}">Start my assessment</button>
        <button class="btn btn-line" type="button" sc-camel-on-click="{{ goAgent }}">Become a partner <span class="ms" aria-hidden="true">arrow_outward</span></button>
      </div>
